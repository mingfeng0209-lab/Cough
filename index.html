<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>咳嗽穴位查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3E7;
  --surface:#FFFFFF;
  --surface-soft:#FDF8F0;
  --text:#3A3226;
  --text-mute:#8F8371;
  --text-faint:#B8AC98;
  --border:#EFE1CB;
  --border-strong:#E3D2B4;
  --shadow:0 3px 14px rgba(58,45,20,0.09);
  --shadow-lift:0 8px 26px rgba(58,45,20,0.16);

  --blue:#3FBEDD;
  --blue-ext:#3D93C7;
  --pink:#F98CA3;
  --orange:#F8B27C;
  --green:#3CAE8C;
  --mint:#74C89E;
  --mauve:#C98FC4;
  --gold:#F6C955;
  --peri:#8B9BF2;
  --purple:#AD97D6;

  --blue-ink:#1C7D94;
  --blue-ext-ink:#1B5E82;
  --pink-ink:#C13E5B;
  --orange-ink:#A85A17;
  --green-ink:#1D7A5D;
  --mint-ink:#237A54;
  --mauve-ink:#8A4E85;
  --gold-ink:#93690F;
  --peri-ink:#4B5EC6;
  --purple-ink:#6D52A6;

  --on-color:#3A3226;

  --bub1:#A9DCEC;
  --bub2:#F7B9CE;
  --bub3:#CBB9EA;
  --bub4:#F7D08E;
  --bub5:#A6E0C2;

  --radius-xl:22px;
  --radius-lg:18px;
  --radius-md:13px;
  --radius-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1912;
    --surface:#2A2319;
    --surface-soft:#302819;
    --text:#F3EBDB;
    --text-mute:#B8AC98;
    --text-faint:#7C7161;
    --border:#453A29;
    --border-strong:#57492F;
    --shadow:0 3px 14px rgba(0,0,0,0.35);
    --shadow-lift:0 8px 26px rgba(0,0,0,0.5);

    --blue-ink:#7FE3F5;
    --blue-ext-ink:#7FC3EE;
    --pink-ink:#FFB3C2;
    --orange-ink:#FFCD9E;
    --green-ink:#7BE8C4;
    --mint-ink:#A3ECC6;
    --mauve-ink:#E8C2E5;
    --gold-ink:#FFE4A3;
    --peri-ink:#C0CBFF;
    --purple-ink:#DECBF3;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1912;
  --surface:#2A2319;
  --surface-soft:#302819;
  --text:#F3EBDB;
  --text-mute:#B8AC98;
  --text-faint:#7C7161;
  --border:#453A29;
  --border-strong:#57492F;
  --shadow:0 3px 14px rgba(0,0,0,0.35);
  --shadow-lift:0 8px 26px rgba(0,0,0,0.5);

  --blue-ink:#7FE3F5;
  --blue-ext-ink:#7FC3EE;
  --pink-ink:#FFB3C2;
  --orange-ink:#FFCD9E;
  --green-ink:#7BE8C4;
  --mint-ink:#A3ECC6;
  --mauve-ink:#E8C2E5;
  --gold-ink:#FFE4A3;
  --peri-ink:#C0CBFF;
  --purple-ink:#DECBF3;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
.serif{font-family:"Noto Serif TC","Noto Sans TC",serif;}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:34px;
}
.back-btn{
  width:34px;height:34px;flex:none;
  border-radius:50%;
  border:none;background:var(--surface-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:pointer;
  transition:transform .15s ease;
}
.back-btn:active{transform:scale(0.9);}
.topbar-title{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:18px;
  flex:1;
  min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar-sub{
  font-size:11px;color:var(--text-mute);margin-top:1px;
}
.topbar-stack{display:flex;flex-direction:column;flex:1;min-width:0;}

/* ---------- Hero (home root) ---------- */
.hero{
  position:relative;
  overflow:hidden;
  padding:22px 18px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.hero .bubble{
  position:absolute;border-radius:50%;filter:blur(0.5px);opacity:0.55;
}
.hero-inner{position:relative;z-index:2;}
.hero h1{
  font-family:"Noto Serif TC",serif;
  font-weight:900;
  font-size:26px;
  margin:0 0 4px;
  letter-spacing:0.5px;
}
.hero p{
  margin:0;
  font-size:13px;
  color:var(--text-mute);
  line-height:1.6;
}

/* ---------- Search ---------- */
.search-wrap{
  position:relative;
  margin:16px 0 0;
}
.search-wrap input{
  width:100%;
  padding:12px 14px 12px 42px;
  border-radius:999px;
  border:1px solid var(--border-strong);
  background:var(--surface-soft);
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  outline:none;
}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--text-faint);pointer-events:none;
}
.search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:none;background:transparent;
  color:var(--text-faint);display:none;align-items:center;justify-content:center;cursor:pointer;
}

/* ---------- Content ---------- */
.content{
  flex:1;
  padding:16px 16px 90px;
}
.section-label{
  font-size:12.5px;
  font-weight:700;
  color:var(--text-mute);
  margin:4px 2px 10px;
}

/* ---------- Chapter blocks (home stacked blocks) ---------- */
.chapter-stack{display:flex;flex-direction:column;gap:14px;}
.chapter-block{
  border-radius:var(--radius-xl);
  padding:18px;
  color:var(--on-color);
  cursor:pointer;
  border:none;
  text-align:left;
  width:100%;
  font-family:inherit;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
  display:flex;
  align-items:center;
  gap:14px;
}
.chapter-block:active{transform:scale(0.98);}
.chapter-icon{
  width:46px;height:46px;flex:none;
  border-radius:50%;
  background:rgba(255,255,255,0.55);
  display:flex;align-items:center;justify-content:center;
}
.chapter-icon svg{width:24px;height:24px;}
.chapter-text{flex:1;min-width:0;}
.chapter-text .ct-title{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:17px;
  margin:0 0 2px;
}
.chapter-text .ct-sub{
  font-size:12px;
  opacity:0.85;
  margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chapter-count{
  font-size:11px;
  font-weight:700;
  background:rgba(255,255,255,0.55);
  border-radius:999px;
  padding:4px 10px;
  flex:none;
  white-space:nowrap;
}
.chapter-chevron{flex:none;width:18px;height:18px;opacity:0.6;}

/* ---------- Section blocks (chapter detail) ---------- */
.sect-block{
  margin-bottom:16px;
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow);
  background:var(--surface);
  border:1px solid var(--border);
}
.sect-head{
  padding:14px 16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--on-color);
}
.sect-head-text{flex:1;min-width:0;}
.sect-head-text .sh-title{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:15.5px;
  margin:0;
}
.sect-head-text .sh-desc{
  font-size:12px;
  margin:3px 0 0;
  opacity:0.82;
  line-height:1.45;
}
.sect-toggle{
  flex:none;width:20px;height:20px;
  transition:transform .2s ease;
}
.sect-toggle.collapsed{transform:rotate(-90deg);}
.sect-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sect-body.collapsed{display:none;}

/* ---------- Point card ---------- */
.point-card{
  background:var(--surface-soft);
  border:1.6px solid var(--pc-color, var(--border-strong));
  border-radius:var(--radius-md);
  padding:12px 13px 13px;
  position:relative;
}
.point-top{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-bottom:6px;
}
.point-name-wrap{flex:1;min-width:0;}
.point-name{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:19px;
  margin:0 0 2px;
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.point-code{
  font-size:12.5px;
  font-weight:700;
  color:var(--pc-ink, var(--text));
}
.point-meridian{
  font-size:11.5px;
  color:var(--text-mute);
}
.point-img-wrap{
  background:var(--surface);
  border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);
  padding:6px;
  margin:8px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.point-img{
  display:block;
  width:100%;
  max-height:230px;
  object-fit:contain;
  border-radius:6px;
}
.point-note{
  display:inline-block;
  font-size:10.5px;
  font-weight:700;
  color:var(--pc-ink,var(--text));
  background:var(--surface);
  border:1px solid var(--pc-color, var(--border));
  border-radius:999px;
  padding:2px 8px;
  margin-bottom:6px;
}
.star-btn{
  flex:none;
  width:32px;height:32px;
  border:none;background:transparent;
  color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  border-radius:50%;
}
.star-btn svg{width:20px;height:20px;transition:transform .15s ease;}
.star-btn.tagged{color:var(--gold-ink);}
.star-btn.pop svg{transform:scale(1.3);}
.point-row{
  font-size:13px;
  line-height:1.55;
  margin:3px 0 0;
  color:var(--text);
}
.point-row b{
  color:var(--pc-ink, var(--text));
  font-weight:700;
  margin-right:2px;
}
.crumb{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:700;
  color:var(--on-color);
  background:var(--pc-color, var(--border));
  border-radius:999px;
  padding:3px 10px;
  margin-bottom:8px;
}

/* ---------- Empty state ---------- */
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-mute);
}
.empty-state svg{width:52px;height:52px;color:var(--border-strong);margin-bottom:14px;}
.empty-state h3{
  font-family:"Noto Serif TC",serif;
  font-size:16px;color:var(--text);margin:0 0 6px;
}
.empty-state p{font-size:13px;margin:0;line-height:1.6;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:sticky;
  bottom:0;
  z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0 4px;
  border:none;background:transparent;
  color:var(--text-faint);
  cursor:pointer;
  position:relative;
  font-family:inherit;
}
.nav-btn svg{width:22px;height:22px;}
.nav-btn span{font-size:10.5px;font-weight:500;}
.nav-btn.active{color:var(--blue-ext-ink);}
.nav-badge{
  position:absolute;top:2px;right:calc(50% - 20px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--pink-ink);color:#fff;
  border-radius:999px;
  font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.fade-in{animation:fadeIn .22s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

@media (min-width:481px){
  #app{box-shadow:0 0 40px rgba(0,0,0,0.08);}
}
</style>
</head>

<div id="app">
  <div id="topbar-slot"></div>
